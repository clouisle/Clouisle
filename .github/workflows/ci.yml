name: CI Check

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Check dependency licenses
      run: uv run python scripts/check_licenses.py

    - name: Check i18n catalogs
      run: uv run python scripts/check_i18n_catalogs.py

    - name: Check i18n legacy sync
      run: uv run python scripts/check_i18n_legacy_sync.py

    - name: Lint with Ruff
      run: uv run ruff check .

    - name: Format check with Ruff
      run: uv run ruff format --check .

    # TODO: Fix mypy type errors in a separate PR (218 errors)
    # - name: Type check with Mypy
    #   run: uv run mypy .

    - name: Run tests with coverage
      run: uv run pytest

    - name: Enforce independent backend coverage
      run: uv run python scripts/check_coverage.py

    - name: Upload backend coverage XML
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: backend-coverage-xml
        path: backend/coverage.xml

    - name: Upload backend coverage HTML
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: backend-coverage-html
        path: backend/htmlcov/

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v7

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Check dependency licenses
      run: bun run license:check

    - name: Lint
      run: bun run lint

    - name: Run tests with coverage
      run: bun run test:coverage

    - name: Check coverage source census
      run: bun run coverage:check

    - name: Upload frontend coverage LCOV
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage-lcov
        path: frontend/coverage/lcov.info

    - name: Build check
      env:
        NEXT_PUBLIC_APP_VERSION: ${{ github.ref_name }}
        NEXT_PUBLIC_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
      run: bun run build

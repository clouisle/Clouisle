[project]
name = "clouisle-backend"
version = "0.1.0"
description = "Backend for Clouisle application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "tortoise-orm[asyncpg]>=1.1.7",
    "asyncpg>=0.31.0",
    "certifi>=2026.10.18",
    "celery>=5.6.3",
    "redis>=7.4.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.15.0",
    "email-validator>=2.3.0",
    "bcrypt==5.0.0",
    "aiosmtplib>=5.1.0",
    "aiofiles>=25.1.0",
    "aiobotocore>=3.0.0",
    "types-aiofiles>=25.1.0.20260409",
    "types-PyYAML>=6.0.12.20250915",
    "httpx[socks]>=0.28.1",
    "langchain>=1.3.9",
    "langchain-core>=1.3.3",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.2.1",
    "langchain-anthropic>=1.4.6",
    "langchain-google-genai>=4.2.1",
    "google-genai>=1.72.0",
    "langgraph>=1.2.14",
    # MCP (Model Context Protocol)
    "mcp>=2.2.0",
    # Document processing
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.8",
    "jieba>=0.42.1",
    # Token counting
    "tiktoken>=0.12.0",
    "jinja2>=3.1.6",
    "jsonpath-ng>=1.8.0",
    "qdrant-client>=1.17.1",
    # SSO (Single Sign-On)
    "authlib>=1.9.1",
    "python3-saml>=1.16.0",
    "python-cas>=1.7.1",
    "cryptography>=48.0.1",
    # Markdown processing
    "markdown>=3.10.2",
    "pyyaml>=6.0.0",
    "gunicorn>=25.3.0",
    "anthropic>=0.94.0",
    # TOTP (Two-Factor Authentication)
    "pyotp>=2.9.0",
    "qrcode>=8.2",
    "pillow>=13.0.0",
    "aiohttp>=3.14.4",
    "urllib3>=2.8.0",
    "Babel>=2.17.0",
    "msgpack>=1.2.3",
    "psutil>=7.1.3",
    "bleach>=6.4.0",
    "feedparser>=6.0.14",
    "trafilatura>=2.2.0",
    "asyncmy>=0.2.14",
    "motor>=3.7.1",
    "sqlglot>=26.0.0",
    "lark-oapi==1.7.5",
    "pypdf>=6.21.4",
    "pypdfium2>=5.12.1",
]

[tool.uv]
constraint-dependencies = [
    "lxml>=6.1.0",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.7.31",
    # Transitive security floors (Dependabot advisories)
    "dnspython>=2.9.0",
    "joserfc>=1.7.6",
    "langgraph-sdk>=0.4.6",
    "multidict>=6.9.1",
    "opentelemetry-api>=1.45.1",
    "pyasn1>=0.6.5",
    "pymongo>=4.18.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
    "pip-licenses>=5.5.5",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "httpx2>=2.9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = [
    "--import-mode=importlib",
    "--cov=app",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--cov-report=json:coverage.json",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true

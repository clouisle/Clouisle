{{- if .Values.opensearch.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  labels:
    {{- include "clouisle.componentLabels" (dict "root" . "component" "opensearch") | nindent 4 }}
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      {{- include "clouisle.selectorLabels" (dict "root" . "component" "opensearch") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clouisle.selectorLabels" (dict "root" . "component" "opensearch") | nindent 8 }}
    spec:
      {{- include "clouisle.podCommon" . | nindent 6 }}
      containers:
        - name: opensearch
          image: {{ printf "%s:%s" .Values.opensearch.image.repository .Values.opensearch.image.tag | quote }}
          imagePullPolicy: {{ .Values.opensearch.image.pullPolicy }}
          ports:
            - name: https
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: bootstrap.memory_lock
              value: "false"
            - name: OPENSEARCH_JAVA_OPTS
              value: {{ .Values.opensearch.javaOpts | quote }}
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "clouisle.secretName" . }}
                  key: OPENSEARCH_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -kfsS -u "admin:$OPENSEARCH_INITIAL_ADMIN_PASSWORD" "https://localhost:9200/_cluster/health?wait_for_status=yellow" >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -kfsS -u "admin:$OPENSEARCH_INITIAL_ADMIN_PASSWORD" https://localhost:9200 >/dev/null
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.opensearch.resources | nindent 12 }}
      {{- if .Values.opensearch.persistence.existingClaim }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.opensearch.persistence.existingClaim }}
      {{- else if not .Values.opensearch.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if and .Values.opensearch.persistence.enabled (not .Values.opensearch.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.opensearch.persistence.accessModes | nindent 10 }}
        {{- if .Values.opensearch.persistence.storageClassName }}
        storageClassName: {{ .Values.opensearch.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.opensearch.persistence.size | quote }}
  {{- end }}
{{- end }}

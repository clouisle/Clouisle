apiVersion: apps/v1
kind: Deployment
metadata:
  name: wechat-receiver
  labels:
    {{- include "clouisle.componentLabels" (dict "root" . "component" "wechat-receiver") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "clouisle.selectorLabels" (dict "root" . "component" "wechat-receiver") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clouisle.selectorLabels" (dict "root" . "component" "wechat-receiver") | nindent 8 }}
    spec:
      {{- include "clouisle.podCommon" . | nindent 6 }}
      containers:
        - name: wechat-receiver
          image: {{ include "clouisle.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["python", "main.py", "wechat-receiver"]
          {{- include "clouisle.envFrom" . | nindent 10 }}
          {{- with .Values.global.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

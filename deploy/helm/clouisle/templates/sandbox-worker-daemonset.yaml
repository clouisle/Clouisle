{{- if .Values.sandboxWorker.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sandbox-worker
  labels:
    {{- include "clouisle.componentLabels" (dict "root" . "component" "sandbox-worker") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "clouisle.selectorLabels" (dict "root" . "component" "sandbox-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clouisle.selectorLabels" (dict "root" . "component" "sandbox-worker") | nindent 8 }}
      {{- with .Values.global.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- $podValues := deepCopy .Values }}
      {{- $_ := set $podValues.global "nodeSelector" (mergeOverwrite (deepCopy .Values.global.nodeSelector) .Values.sandboxWorker.nodeSelector) }}
      {{- $_ := set $podValues.global "tolerations" (concat .Values.global.tolerations .Values.sandboxWorker.tolerations) }}
      {{- include "clouisle.podCommon" (dict "Values" $podValues "Release" .Release "Chart" .Chart) | nindent 6 }}
      terminationGracePeriodSeconds: 35
      {{- $sandboxSecurityContext := mergeOverwrite (deepCopy (default (dict) .Values.global.securityContext)) (default (dict) .Values.sandboxWorker.securityContext) }}
      containers:
        - name: sandbox-worker
          image: {{ include "clouisle.sandboxWorkerImage" . | quote }}
          imagePullPolicy: {{ .Values.images.sandboxWorker.pullPolicy }}
          command:
            {{- toYaml .Values.sandboxWorker.command | nindent 12 }}
          {{- include "clouisle.envFrom" . | nindent 10 }}
          env:
            - name: UPLOAD_STORAGE_MODE
              value: "remote"
            - name: INTERNAL_API_TOKEN_FILE
              value: /var/run/secrets/clouisle/internal-api-token
            - name: SANDBOX_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SANDBOX_WORKER_ID
              value: ""
          volumeMounts:
            - name: internal-api-token
              mountPath: /var/run/secrets/clouisle
              readOnly: true
            - name: sandbox-data
              mountPath: {{ dir .Values.config.SANDBOX_WORKSPACE_ROOT | quote }}
          {{- with $sandboxSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.sandboxWorker.resources | nindent 12 }}
      volumes:
        - name: sandbox-data
          hostPath:
            path: {{ default (printf "/var/lib/clouisle/%s/%s/sandbox" .Release.Namespace .Release.Name) .Values.sandboxWorker.localDataPath | quote }}
            type: DirectoryOrCreate
        - name: internal-api-token
          secret:
            secretName: {{ include "clouisle.secretName" . }}
            items:
              - key: INTERNAL_API_TOKEN
                path: internal-api-token
{{- end }}

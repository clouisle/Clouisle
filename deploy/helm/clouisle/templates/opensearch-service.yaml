{{- if .Values.opensearch.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  labels:
    {{- include "clouisle.componentLabels" (dict "root" . "component" "opensearch") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "clouisle.selectorLabels" (dict "root" . "component" "opensearch") | nindent 4 }}
  ports:
    - name: https
      port: 9200
      targetPort: https
{{- end }}

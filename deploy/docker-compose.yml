services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  db:
    image: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-postgres-pg-search:0.24.3-pg17-alpine1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-clouisle}
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "shared_preload_libraries=pg_search,pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$REDIS_PASSWORD"
        else
          redis-server
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $${REDIS_PASSWORD}} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  api:
    image: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-backend:latest
    restart: unless-stopped
    command: ["python", "main.py", "server", "-H", "0.0.0.0", "-w", "4", "--no-reload"]
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      SANDBOX_ARTIFACT_UPLOAD_BASE_URL: http://api:8000
      POSTGRES_SERVER: db
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # Same virtual path as sandbox-worker; its physical data mount is not shared.
      SANDBOX_WORKSPACE_ROOT: /var/lib/clouisle/sandbox/jobs
      SANDBOX_CHECKPOINT_ROOT: /var/lib/clouisle/sandbox/checkpoints
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    image: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-backend:latest
    restart: unless-stopped
    command: ["python", "main.py", "worker", "-c", "4", "-Q", "default,agent,knowledge,workflow"]
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      SANDBOX_ARTIFACT_UPLOAD_BASE_URL: http://api:8000
      POSTGRES_SERVER: db
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
      UPLOAD_STORAGE_MODE: remote
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://api:8000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      SANDBOX_WORKSPACE_ROOT: /var/lib/clouisle/sandbox/jobs
      SANDBOX_CHECKPOINT_ROOT: /var/lib/clouisle/sandbox/checkpoints
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      api:
        condition: service_healthy

  sandbox-worker:
    image: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-sandbox-worker:latest
    restart: unless-stopped
    command: ["python", "main.py", "sandbox-worker", "-c", "${SANDBOX_WORKER_CONCURRENCY:-1}"]
    # One service owns this disk; do not scale it with a shared named volume.
    stop_grace_period: 35s
    volumes:
      - sandbox_data:/var/lib/clouisle/sandbox
    env_file: .env
    # Bubblewrap needs SYS_ADMIN and SETFCAP for namespaces; NET_ADMIN lets
    # the trusted proxy bridge enable loopback before dropping task caps.
    user: "0"
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SETFCAP
      - NET_ADMIN
    pids_limit: 512
    cpus: 2
    mem_limit: 2g
    environment:
      API_BASE_URL: http://api:8000
      SANDBOX_ARTIFACT_UPLOAD_BASE_URL: http://api:8000
      POSTGRES_SERVER: db
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
      UPLOAD_STORAGE_MODE: remote
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://api:8000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      SANDBOX_WORKSPACE_ROOT: /var/lib/clouisle/sandbox/jobs
      SANDBOX_CHECKPOINT_ROOT: /var/lib/clouisle/sandbox/checkpoints
      SANDBOX_NODE_ID: ${SANDBOX_NODE_ID:-compose-local}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      api:
        condition: service_healthy

  beat:
    image: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-backend:latest
    restart: unless-stopped
    command: ["python", "main.py", "beat"]
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      SANDBOX_ARTIFACT_UPLOAD_BASE_URL: http://api:8000
      POSTGRES_SERVER: db
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    image: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-frontend:latest
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://api:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  uploads_data:
  sandbox_data:
